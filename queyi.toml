# 注意：tools/ 当前仍按 `ROOT/<dir>` 解析路径（ROOT = 本仓库根）。
# 本仓库用 **junction/symlink** 把 data/ 与 atoms/ 指到下面的路径，借此实现
# 「路径可配置」而不必改每个工具的路径逻辑（生产化再把 tools 改为读本文件的
# data_path/atoms_path，列为后续 TODO，见 README）。

